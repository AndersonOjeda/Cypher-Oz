services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: tti
      POSTGRES_USER: tti
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - tti_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tti -d tti"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  tti_postgres:
